appId: com.dsh.desktop.workbench
productName: DSH Desktop
copyright: Copyright © 2026 dsh-desktop contributors

directories:
  output: release
  buildResources: resources

files:
  - dist/**
  - resources/profile-template/**
  - resources/shell-pages/**
  - resources/plugins/**
  - resources/icons/**
  - package.json

# 运行时以 tar.gz 分发（electron-builder 会剔除 extraResources 中的 node_modules，
# 故由壳在首启解压到 %LOCALAPPDATA%/DSH Desktop/runtime）
extraResources:
  - from: resources/dsh-runtime.tar.gz
    to: dsh-runtime.tar.gz
  - from: resources/runtime.version
    to: runtime.version

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icons/icon.ico
  executableName: dsh-desktop

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-${arch}.${ext}
  # macOS 深链：Info.plist 声明 dsh:// scheme（setAsDefaultProtocolClient 依赖）
  protocols:
    - name: DSH Desktop Link
      schemes:
        - dsh

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DSH Desktop
  artifactName: ${productName}-${version}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}

npmRebuild: false

# 自动更新源（第 1 层·桌面端）：直接对接仓库的 GitHub Releases。
# provider: github 时 electron-updater 查询该仓库的 latest release，比对系统版本，
# 有新版即下载对应平台的安装包替换。GitHub 既是发布源也是更新源，无需额外服务器。
#
# 说明：官方 harness 更新走的是另一套检测（src/main/harnessCheck.ts，查 npm registry），
# 与本字段无关——本字段只决定「DSH Desktop 外壳」自己怎么更新。
publish:
  provider: github
  owner: Plocr
  repo: dsh-desktop

# 本机复用 node_modules/electron/dist（避免重复下载）——仅用于本机打包 win 目标。
# CI（GitHub Actions）不设置此值，让 electron-builder 自动下载对应平台 Electron。
# 说明：electronDist 内二进制是平台相关的，若在非 Windows 机器打包请删除此项。
