appId: com.dsh.desktop.workbench
productName: DSH Desktop
copyright: Copyright © 2026 dsh-desktop contributors

directories:
  output: release
  buildResources: resources

files:
  - dist/**
  - resources/profile-template/**
  - resources/shell-pages/**
  - resources/icons/**
  - package.json

# 运行时随包分发（对齐官方 apps/desktop 的 extraResources 形状）：
#   resources/runtime  便携 Node + pnpm（+ versions.json）
#   resources/dsh      dsh 运行时树（+ desktop-runtime.json 完整性清单）
# 官方要点：electron-builder 会剔除 extraResources 里源目录的**根 node_modules**，
# 因此必须为 dsh/node_modules 再显式声明一条映射（官方 config 同款做法）。
# 树本身已按 scripts/runtime-file-policy.mjs 裁剪，且带 sha256 清单（启动时校验）。
extraResources:
  - from: resources/runtime
    to: runtime
    # 便携 Node 里只保留 node 可执行文件：`node/node_modules/npm`（1739 文件 / 10 MB）
    # 只在**构建期**被 scripts/setup-runtime.mjs 用来安装 dsh 闭包，运行期一律走随包 pnpm
    # （pnpm/dist 自带 node-gyp）。剔除它显著减少安装包文件数 → NSIS 安装更快。
    filter:
      - '**/*'
      - '!node/node_modules/npm/**'
  - from: resources/dsh
    to: dsh
  - from: resources/dsh/node_modules
    to: dsh/node_modules

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icons/icon.ico
  executableName: dsh-desktop
  # 代码签名：脚本按环境变量决定（DSH_DESKTOP_WINDOWS_* + SafeNet EV 令牌）。
  # 未配置签名环境时脚本显式跳过（不明文失败，保持可打未签名测试包）；
  # 配置了一半则硬报错，绝不做「看起来签名了其实没签」的假签名。
  signtoolOptions:
    sign: ./scripts/windows-sign.mjs
    signingHashAlgorithms:
      - sha256

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  # 注意：artifactName 不能用 ${productName}（含空格）——electron-builder 在
  # latest.yml 里把空格 sanitize 成连字符，而 gh release upload 把空格转成点号，
  # 导致更新元数据文件名与实际资产名不一致、下载 404。固定用无空格的点号名。
  artifactName: DSH.Desktop-${version}-${arch}.${ext}
  # macOS 深链：Info.plist 声明 dsh:// scheme（setAsDefaultProtocolClient 依赖）
  protocols:
    - name: DSH Desktop Link
      schemes:
        - dsh
  # 签名/公证：CSC_*（证书）就绪时 electron-builder 自动签 .app；
  # 公证与 stapling 由 scripts/package-macos.mjs 单独执行（未配置凭据时自动跳过），
  # 因此这里关掉 electron-builder 自带的 notarize，避免两套流程互相干扰。
  hardenedRuntime: true
  notarize: false
  # 随包运行时（resources/dsh 与 resources/runtime）是不可变的签名产物：
  # 官方桌面端同样把它们排除在 electron-builder 签名之外（signIgnore），
  # 否则会对上万条 dsh 依赖文件逐个签名（含原生模块），既慢又会被公证挑刺。
  signIgnore:
    - /Contents/Resources/dsh(?:/|$)
    - /Contents/Resources/runtime(?:/|$)

dmg:
  artifactName: DSH.Desktop-${version}-${arch}.${ext}
  # dmg 本身也做 Developer ID 签名（无证书时 dmg-builder 静默跳过）
  sign: true

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DSH Desktop
  artifactName: DSH.Desktop-${version}-setup.${ext}
  include: scripts/installer.nsh

portable:
  artifactName: DSH.Desktop-${version}-portable.${ext}

npmRebuild: false

# 自动更新源：直接对接仓库的 GitHub Releases。
# 官方桌面端把「壳 + dsh 运行时 + Node + pnpm」当作**一个签名更新单元**：
# 本仓库用 resources/dsh/desktop-runtime.json 把四者版本绑定在一起，
# 启动时校验（见 src/main/runtimeTree.ts），因此不存在单独更新 harness 的通道。
publish:
  provider: github
  owner: Plocr
  repo: dsh-desktop

# 本机复用 node_modules/electron/dist（避免重复下载）——仅用于本机打包 win 目标。
# CI（GitHub Actions）不设置此值，让 electron-builder 自动下载对应平台 Electron。
# 说明：electronDist 内二进制是平台相关的，若在非 Windows 机器打包请删除此项。
