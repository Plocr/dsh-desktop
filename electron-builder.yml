appId: com.dsh.desktop.workbench
productName: DSH Desktop
copyright: Copyright © 2026 dsh-desktop contributors

directories:
  output: release
  buildResources: resources

files:
  - dist/**
  - resources/profile-template/**
  - resources/shell-pages/**
  - resources/plugins/**
  - resources/icons/**
  - package.json

# 运行时以 tar.gz 分发（electron-builder 会剔除 extraResources 中的 node_modules，
# 故由壳在首启解压到 %LOCALAPPDATA%/DSH Desktop/runtime）
extraResources:
  - from: resources/dsh-runtime.tar.gz
    to: dsh-runtime.tar.gz
  - from: resources/runtime.version
    to: runtime.version

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icons/icon.ico
  executableName: dsh-desktop

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-${arch}.${ext}
  # macOS 深链：Info.plist 声明 dsh:// scheme（setAsDefaultProtocolClient 依赖）
  protocols:
    - name: DSH Desktop Link
      schemes:
        - dsh

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DSH Desktop
  artifactName: ${productName}-${version}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}

npmRebuild: false

# 自动更新源（generic）。默认占位地址不可达（.invalid 保留域名），
# 真实部署时覆盖：npx electron-builder --win nsis --config.publish.url=https://你的更新服务器/
# 或设置 DSH_DESKTOP_UPDATE_URL 运行时覆盖。
publish:
  provider: generic
  url: https://updates.dsh-desktop.invalid/dsh-desktop

# 复用 node_modules/electron/dist，避免 electron-builder 重新下载。
# 注意：electronDist 内的二进制是平台相关的——在本机（Windows）上打包 win 目标
# 可复用；打包 mac 目标时 electron-builder 会自动下载 mac 版 Electron，
# 此配置仅对当前平台生效，不会污染 mac 产物。
electronDist: node_modules/electron/dist
