name: build-release

# 推送 v* 标签时构建 Windows + macOS 安装包并上传到对应 Release。
# 每个平台 job 独立构建（运行时 tar.gz 是平台相关的，必须本平台生成），
# macOS arm64/x64 分两个 runner（macos-latest=arm64，macos-13=x64），
# 产物按平台前缀命名，互不覆盖。
# 手动触发（workflow_dispatch）：必须指定 tag 名（如 v0.4.1），上传到该 Release。

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag 名（如 v0.4.1）'
        required: true

permissions:
  contents: write

jobs:
  # 质量门禁：类型检查 + 单元测试（push master / PR 必跑；tag 推送也跑）
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm install
      - name: Build app + runtime
        run: |
          node scripts/build.mjs
          node scripts/make-icons.mjs
          node scripts/setup-runtime.mjs
      - name: Package NSIS installer
        run: npx electron-builder --win nsis --publish never
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        shell: bash
        run: |
          # 上传安装包 + latest.yml（GitHub provider 的更新元数据，updater 依赖）
          gh release upload "$RELEASE_TAG" release/*.exe release/latest.yml --clobber

  build-macos-arm64:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm install
      - name: Build app + runtime
        run: |
          node scripts/build.mjs
          node scripts/make-icons.mjs
          node scripts/setup-runtime.mjs
      - name: Package DMG (arm64)
        run: npx electron-builder --mac dmg --arm64 --publish never
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        shell: bash
        run: |
          # 上传 DMG + blockmap（差分更新用；latest-mac.yml 由 merge-mac-manifest 合并上传）
          gh release upload "$RELEASE_TAG" release/*arm64*.dmg release/*arm64*.dmg.blockmap --clobber

  build-macos-x64:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm install
      - name: Build app + runtime
        run: |
          node scripts/build.mjs
          node scripts/make-icons.mjs
          node scripts/setup-runtime.mjs
      - name: Package DMG (x64)
        run: npx electron-builder --mac dmg --x64 --publish never
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" release/*x64*.dmg release/*x64*.dmg.blockmap --clobber

  # macOS 多架构更新的关键：把两个架构各自生成的 latest-mac.yml 合并为一份
  # 含 arm64+x64 的 files[]，供 electron-updater 按 process.arch 挑选。
  merge-mac-manifest:
    needs: [build-macos-arm64, build-macos-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download dmg + blockmap assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        shell: bash
        run: |
          mkdir -p dmg
          gh release download "$RELEASE_TAG" --pattern '*.dmg' --pattern '*.dmg.blockmap' --dir dmg
          ls -la dmg
      - name: Merge latest-mac.yml
        run: node scripts/merge-mac-manifest.mjs ./dmg ./dmg/latest-mac.yml
      - name: Upload merged latest-mac.yml
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" ./dmg/latest-mac.yml --clobber
