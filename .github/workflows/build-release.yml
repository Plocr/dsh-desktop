name: build-release

# 推送 v* 标签时构建 Windows + macOS 安装包并上传到对应 Release。
# 每个平台 job 独立构建（运行时 tar.gz 是平台相关的，必须本平台生成），
# 产物按平台前缀命名，互不覆盖。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm install
      - name: Build app + runtime
        run: |
          node scripts/build.mjs
          node scripts/make-icons.mjs
          node scripts/setup-runtime.mjs
      - name: Package NSIS installer
        run: npx electron-builder --win nsis --publish never
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" release/*.exe --clobber

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm install
      - name: Build app + runtime
        run: |
          node scripts/build.mjs
          node scripts/make-icons.mjs
          node scripts/setup-runtime.mjs
      - name: Package DMG (arm64 + x64)
        run: npx electron-builder --mac dmg --publish never
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" release/*.dmg --clobber
