name: build-release

# 鎺ㄩ€?v* 鏍囩鏃舵瀯寤?Windows + macOS 瀹夎鍖呭苟涓婁紶鍒板搴?Release銆?# 姣忎釜骞冲彴 job 鐙珛鏋勫缓锛堣繍琛屾椂 tar.gz 鏄钩鍙扮浉鍏崇殑锛屽繀椤绘湰骞冲彴鐢熸垚锛夛紝
# macOS arm64/x64 鍒嗕袱涓?runner锛坢acos-latest=arm64锛宮acos-13=x64锛夛紝
# 浜х墿鎸夊钩鍙板墠缂€鍛藉悕锛屼簰涓嶈鐩栥€?# 鎵嬪姩瑙﹀彂锛坵orkflow_dispatch锛夛細蹇呴』鎸囧畾 tag 鍚嶏紙濡?v0.4.1锛夛紝涓婁紶鍒拌 Release銆?
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag 鍚嶏紙濡?v0.4.1锛?
        required: true

permissions:
  contents: write

jobs:
  # 璐ㄩ噺闂ㄧ锛氱被鍨嬫鏌?+ 鍗曞厓娴嬭瘯锛坧ush master / PR 蹇呰窇锛泃ag 鎺ㄩ€佷篃璺戯級
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test

  # 閲嶅瀷鏋勫缓锛堝惈 20-30 鍒嗛挓杩愯鏃跺畨瑁咃級鍙湪鎵?tag / 鎵嬪姩瑙﹀彂鏃惰窇锛?  # master 涓?PR 鍙窇涓婃柟 check锛岄伩鍏嶆瘡娆?push 鐧界儳鏃堕暱涓庝笂浼犲埌涓嶅瓨鍦?release 鐨勫け璐ャ€?  build-windows:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm install
      - name: Cache dsh runtime (鍛戒腑鍒欒烦杩?20-30 鍒嗛挓 npm install)
        uses: actions/cache@v4
        with:
          path: resources/dsh-runtime
          key: dsh-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-runtime.mjs', 'packages/bridge/package.json') }}
          restore-keys: |
            dsh-runtime-${{ runner.os }}-${{ runner.arch }}-
      - name: Build app + runtime
        run: |
          node scripts/build.mjs
          node scripts/make-icons.mjs
          node scripts/setup-runtime.mjs
      - name: Package NSIS installer
        run: npx electron-builder --win nsis --publish never
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        shell: bash
        run: |
          # 鑻?release 灏氫笉瀛樺湪锛堝垰鎵?tag 灏氭湭寤?release锛夊垯鍏堝垱寤猴紝閬垮厤 upload 鎶?release not found
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "DSH Desktop $RELEASE_TAG" --generate-notes
          fi
          # 涓婁紶瀹夎鍖?+ latest.yml锛圙itHub provider 鐨勬洿鏂板厓鏁版嵁锛寀pdater 渚濊禆锛?          gh release upload "$RELEASE_TAG" release/*.exe release/latest.yml --clobber

  build-macos-arm64:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    # macOS 闈炲綋鍓嶅彂甯冧富骞冲彴锛堟棤缁存姢鑰呭湪 mac 涓婅皟璇曡繍琛屾椂鏋勫缓锛夛紝best-effort锛氬け璐ヤ笉绾€?    continue-on-error: true
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm install
      - name: Cache dsh runtime (鍛戒腑鍒欒烦杩?20-30 鍒嗛挓 npm install)
        uses: actions/cache@v4
        with:
          path: resources/dsh-runtime
          key: dsh-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-runtime.mjs', 'packages/bridge/package.json') }}
          restore-keys: |
            dsh-runtime-${{ runner.os }}-${{ runner.arch }}-
      - name: Build app + runtime
        run: |
          node scripts/build.mjs
          node scripts/make-icons.mjs
          node scripts/setup-runtime.mjs
      - name: Package DMG (arm64)
        run: npx electron-builder --mac dmg --arm64 --publish never
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        shell: bash
        run: |
          # 涓婁紶 DMG + blockmap锛堝樊鍒嗘洿鏂扮敤锛沴atest-mac.yml 鐢?merge-mac-manifest 鍚堝苟涓婁紶锛?          gh release upload "$RELEASE_TAG" release/*arm64*.dmg release/*arm64*.dmg.blockmap --clobber

  build-macos-x64:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    # macOS 闈炲綋鍓嶅彂甯冧富骞冲彴锛宐est-effort锛氬け璐ヤ笉绾€?    continue-on-error: true
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm install
      - name: Cache dsh runtime (鍛戒腑鍒欒烦杩?20-30 鍒嗛挓 npm install)
        uses: actions/cache@v4
        with:
          path: resources/dsh-runtime
          key: dsh-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-runtime.mjs', 'packages/bridge/package.json') }}
          restore-keys: |
            dsh-runtime-${{ runner.os }}-${{ runner.arch }}-
      - name: Build app + runtime
        run: |
          node scripts/build.mjs
          node scripts/make-icons.mjs
          node scripts/setup-runtime.mjs
      - name: Package DMG (x64)
        run: npx electron-builder --mac dmg --x64 --publish never
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" release/*x64*.dmg release/*x64*.dmg.blockmap --clobber

  # macOS 澶氭灦鏋勬洿鏂扮殑鍏抽敭锛氭妸涓や釜鏋舵瀯鍚勮嚜鐢熸垚鐨?latest-mac.yml 鍚堝苟涓轰竴浠?  # 鍚?arm64+x64 鐨?files[]锛屼緵 electron-updater 鎸?process.arch 鎸戦€夈€?  merge-mac-manifest:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [build-macos-arm64, build-macos-x64]
    # mac 涓?best-effort锛坈ontinue-on-error锛夛紱鍚堝苟鍚屾牱涓嶇孩銆?    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download dmg + blockmap assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        shell: bash
        run: |
          mkdir -p dmg
          gh release download "$RELEASE_TAG" --pattern '*.dmg' --pattern '*.dmg.blockmap' --dir dmg
          ls -la dmg
      - name: Merge latest-mac.yml
        run: node scripts/merge-mac-manifest.mjs ./dmg ./dmg/latest-mac.yml
      - name: Upload merged latest-mac.yml
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" ./dmg/latest-mac.yml --clobber

