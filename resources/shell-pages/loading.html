<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:;" />
<title>DSH Desktop</title>
<style>
  html, body { height: 100%; margin: 0; background: #0e1116; color: #d7dee8; font-family: "Segoe UI", system-ui, sans-serif; display: flex; align-items: center; justify-content: center; }
  .box { text-align: center; }
  .spinner { width: 36px; height: 36px; margin: 0 auto 16px; border: 3px solid #2a3441; border-top-color: #4d7cfe; border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .sub { font-size: 12px; color: #7d8aa0; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <div class="title">正在启动 DeepSeek Harness…</div>
    <div class="sub" id="sub">启动桌面工作台</div>
  </div>
  <script>
    const sub = document.getElementById('sub')
    if (location.search) {
      const q = new URLSearchParams(location.search)
      const state = q.get('state')
      if (state) sub.textContent = decodeURIComponent(state)
    }
  </script>
</body>
</html>
