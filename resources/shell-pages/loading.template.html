<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline';" />
<title>DSH Desktop</title>
<style>
  html, body {
    height: 100%; margin: 0; overflow: hidden;
    background: #ffffff; color: #0f1115;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0;
    animation: fadeIn 0.5s ease forwards;
  }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  /* 淡出由壳在 ready 时触发（window.__fadeOut） */
  .stage.fading { transition: opacity 0.35s ease; opacity: 0; }

  /* 静态黑白鲸鱼 logo（官网品牌 path，fill 近黑），矢量直渲 */
  .whale {
    width: min(34vw, 260px);
    aspect-ratio: 24 / 18;
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.015); }
  }

  .brand { margin-top: 16px; text-align: center; }
  .title { font-size: 15px; font-weight: 600; margin-bottom: 5px; letter-spacing: 0.2px; color: #0f1115; }
  .sub { font-size: 12px; color: #6b7280; }

  /* 极简加载点（三个依次脉冲），保持页面有活动感 */
  .dots { margin-top: 14px; display: flex; gap: 6px; justify-content: center; }
  .dots span {
    width: 5px; height: 5px; border-radius: 50%;
    background: #0f1115;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 100% { opacity: 0.25; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-2px); }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <svg class="whale" viewBox="0 0 24 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="DeepSeek Harness">
      <path d="__WHALE_PATH__" fill="#0f1115"></path>
    </svg>
    <div class="brand">
      <div class="title">正在启动 DeepSeek Harness…</div>
      <div class="sub" id="sub">启动桌面工作台</div>
    </div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
<script>
/* 淡出钩子：壳在 ready 时调用，渐变淡出后再切到工作台 */
window.__fadeOut = () =>
  new Promise((resolve) => {
    const stage = document.getElementById('stage')
    stage.classList.add('fading')
    setTimeout(resolve, 380)
  })

if (location.search) {
  const q = new URLSearchParams(location.search)
  const state = q.get('state')
  if (state) document.getElementById('sub').textContent = decodeURIComponent(state)
}
</script>
</body>
</html>
