<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
<title>DSH Desktop</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #0f1115;
    --sub: #6b7280;
  }
  /* 兜底：跟随系统主题 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg: #151517;
      --ink: #f9fafb;
      --sub: #9aa0a6;
    }
  }
  /* 壳传入 ?theme= 强制主题（跟随 harness 设置：浅色/深色/跟随系统） */
  :root[data-theme="dark"] {
    --bg: #151517;
    --ink: #f9fafb;
    --sub: #9aa0a6;
  }
  :root[data-theme="light"] {
    --bg: #ffffff;
    --ink: #0f1115;
    --sub: #6b7280;
  }
  html, body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0;
    animation: fadeIn 0.5s ease forwards;
  }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  /* 淡出由壳在 ready 时触发（window.__fadeOut） */
  .stage.fading { transition: opacity 0.35s ease; opacity: 0; }

  /* 静态黑白鲸鱼 logo（官网品牌 path，随主题取色），矢量直渲 */
  .whale {
    width: min(34vw, 260px);
    aspect-ratio: 24 / 18;
    color: var(--ink);
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.015); }
  }

  .brand { margin-top: 16px; text-align: center; }
  .title { font-size: 15px; font-weight: 600; margin-bottom: 5px; letter-spacing: 0.2px; color: var(--ink); }
  .sub { font-size: 12px; color: var(--sub); }

  /* 极简加载点（三个依次脉冲），保持页面有活动感 */
  .dots { margin-top: 14px; display: flex; gap: 6px; justify-content: center; }
  .dots span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--ink);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 100% { opacity: 0.25; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-2px); }
  }

  /* 本地更新面板（mode=update 时显示）：进度条 + 详情行 + 下载地址 */
  .updatePanel {
    display: none;
    position: fixed; inset: 0;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 0 40px;
    background: var(--bg);
  }
  .updatePanel.on { display: flex; }
  .updateTitle { font-size: 14px; font-weight: 600; color: var(--ink); }
  .updateDetail { font-size: 12px; color: var(--sub); text-align: center; line-height: 1.6; }
  .updateUrl {
    display: none;
    max-width: 560px; font-size: 11px; color: var(--sub);
    word-break: break-all; text-align: center; line-height: 1.6;
    border: 1px solid rgba(127,127,127,.25); border-radius: 8px; padding: 6px 10px;
    background: rgba(127,127,127,.08);
  }
  .track {
    width: min(420px, 80vw); height: 6px; border-radius: 999px;
    background: rgba(127,127,127,.20); overflow: hidden;
  }
  .bar {
    height: 100%; width: 0%; border-radius: 999px;
    background: var(--ink); transition: width .2s ease;
  }
  .bar.indeterminate {
    width: 30%; background: var(--ink);
    animation: slide 1.2s ease-in-out infinite;
  }
  @keyframes slide {
    0% { margin-left: -30%; }
    100% { margin-left: 100%; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <svg class="whale" viewBox="0 0 24 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="DeepSeek Harness">
      <path d="__WHALE_PATH__" fill="currentColor"></path>
    </svg>
    <div class="brand">
      <div class="title">正在启动 DeepSeek Harness…</div>
      <div class="sub" id="sub">启动桌面工作台</div>
    </div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
  <div class="updatePanel" id="updatePanel">
    <div class="updateTitle">正在更新框架…</div>
    <div class="track"><div class="bar" id="updateBar"></div></div>
    <div class="updateDetail" id="updateDetail">准备中</div>
    <div class="updateUrl" id="updateUrl"></div>
  </div>
<script>
/* 壳传入 ?theme=light|dark 时强制主题（跟随 harness 设置）；缺省跟随系统 */
const theme = new URLSearchParams(location.search).get('theme')
if (theme === 'light' || theme === 'dark') {
  document.documentElement.dataset.theme = theme
}

/* 淡出钩子：壳在 ready 时调用，渐变淡出后再切到工作台 */
window.__fadeOut = () =>
  new Promise((resolve) => {
    const stage = document.getElementById('stage')
    stage.classList.add('fading')
    setTimeout(resolve, 380)
  })

/* 本地更新模式（mode=update）：切到更新面板，支持 __setUpdate 逐帧刷新 */
const PANEL_MODE = new URLSearchParams(location.search).get('mode') === 'update'
if (PANEL_MODE) {
  const stage = document.getElementById('stage')
  const panel = document.getElementById('updatePanel')
  stage.style.display = 'none'
  panel.classList.add('on')
  const q = new URLSearchParams(location.search)
  const initDetail = q.get('detail')
  const initUrl = q.get('url')
  if (initDetail) document.getElementById('updateDetail').textContent = decodeURIComponent(initDetail)
  if (initUrl) {
    const el = document.getElementById('updateUrl')
    el.textContent = '下载地址：' + decodeURIComponent(initUrl)
    el.style.display = 'block'
  }
  window.__setUpdate = (pct, detail, url) => {
    if (typeof detail === 'string' && detail) document.getElementById('updateDetail').textContent = detail
    if (typeof url === 'string' && url) {
      const el = document.getElementById('updateUrl')
      el.textContent = '下载地址：' + url
      el.style.display = 'block'
    }
    const bar = document.getElementById('updateBar')
    const numeric = typeof pct === 'number' && Number.isFinite(pct)
    bar.classList.toggle('indeterminate', !numeric)
    if (numeric) bar.style.width = Math.max(0, Math.min(100, pct)) + '%'
  }
} else {
  window.__setUpdate = () => {}
}

if (location.search && !PANEL_MODE) {
  const q = new URLSearchParams(location.search)
  const state = q.get('state')
  if (state) document.getElementById('sub').textContent = decodeURIComponent(state)
}
</script>
</body>
</html>
