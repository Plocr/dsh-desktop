<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;" />
<title>DSH Desktop</title>
<style>
  html, body {
    height: 100%; margin: 0; overflow: hidden;
    background: #0e1116; color: #d7dee8;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .stage { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .whale-wrap { position: relative; width: min(62vw, 460px); aspect-ratio: 4 / 3; }
  canvas#glow {
    position: absolute; inset: 0; width: 100%; height: 100%;
    filter: blur(18px); opacity: 0.75;
  }
  canvas#whale { position: absolute; inset: 0; width: 100%; height: 100%; }
  .brand { margin-top: 18px; text-align: center; }
  .title { font-size: 15px; font-weight: 600; margin-bottom: 6px; letter-spacing: 0.2px; }
  .sub { font-size: 12px; color: #7d8aa0; }
</style>
</head>
<body>
  <div class="stage">
    <div class="whale-wrap">
      <canvas id="glow"></canvas>
      <canvas id="whale"></canvas>
    </div>
    <div class="brand">
      <div class="title">正在启动 DeepSeek Harness…</div>
      <div class="sub" id="sub">启动桌面工作台</div>
    </div>
  </div>
<script>
/* 粒子鲸鱼加载动画：SVG 剪影像素采样 + 弹性粒子系统 + 呼吸游动 + 光晕层。
   鲸鱼形状取自 DeepSeek 官网品牌素材（hero-whale.svg，viewBox 24x18）。 */
const WHALE_PATH = "__WHALE_PATH__"
const WHALE_SVG = '<svg width="24" height="18" viewBox="0 0 24 18" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="' + WHALE_PATH + '"/></svg>'
const ASPECT = 24 / 18
const BG = [14, 17, 22]
const BLUE_A = [77, 124, 255]
const BLUE_B = [122, 160, 255]
const WHITE = [232, 240, 255]
const MAX_PARTICLES = 1100

const main = document.getElementById('whale')
const glow = document.getElementById('glow')
const ctx = main.getContext('2d')
const gctx = glow.getContext('2d')
let W = 0, H = 0, DPR = 1
let targets = []          // 归一化目标点 [{x, y}]
let particles = []        // {tx, ty, x, y, vx, vy, phase, size, alpha, white}
let running = false

/* ── 尺寸 ── */
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1)
  W = main.clientWidth
  H = main.clientHeight
  for (const c of [main, glow]) {
    c.width = Math.round(W * DPR)
    c.height = Math.round(H * DPR)
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0)
  gctx.setTransform(DPR, 0, 0, DPR, 0, 0)
}
window.addEventListener('resize', resize)

/* ── SVG 像素采样 ── */
async function sampleTargets() {
  const img = new Image()
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(WHALE_SVG)
  await img.decode()
  const off = document.createElement('canvas')
  off.width = 480
  off.height = 360
  const octx = off.getContext('2d', { willReadFrequently: true })
  octx.fillStyle = '#000'
  octx.fillRect(0, 0, 480, 360)
  octx.drawImage(img, 0, 0, 480, 360)
  const data = octx.getImageData(0, 0, 480, 360).data
  const pts = []
  const step = 4
  for (let y = 0; y < 360; y += step) {
    for (let x = 0; x < 480; x += step) {
      if (data[(y * 480 + x) * 4 + 3] > 128) pts.push({ x: x / 480, y: y / 360 })
    }
  }
  return pts
}

/* ── 粒子 ── */
function makeParticles() {
  const count = Math.max(320, Math.min(targets.length, MAX_PARTICLES))
  particles = []
  for (let i = 0; i < count; i++) {
    const tp = targets[(Math.random() * targets.length) | 0]
    particles.push({
      tx: tp.x, ty: tp.y,
      x: Math.random() * W, y: Math.random() * H,
      vx: 0, vy: 0,
      phase: Math.random() * Math.PI * 2,
      size: 1 + Math.random() * 1.5,
      alpha: 0.45 + Math.random() * 0.5,
      white: Math.random() < 0.08,
    })
  }
}

/* 目标绘制坐标：居中 + 呼吸缩放 + 相位游动 */
function targetFor(p, t) {
  const ww = Math.min(W * 0.96, 460)
  const wh = ww / ASPECT
  const cx = W / 2
  const cy = H / 2 - wh * 0.08
  const breathe = 1 + 0.022 * Math.sin(t / 2600)
  const wob = 0.008 * Math.sin(t / 1700 + p.phase)
  return {
    x: cx + (p.tx - 0.5) * ww * breathe + wob * ww,
    y: cy + (p.ty - 0.5) * wh * breathe,
  }
}

function colorOf(p, t) {
  const c = p.white ? WHITE : (Math.random() < 0.5 ? BLUE_A : BLUE_B)
  const shimmer = 0.75 + 0.25 * Math.sin(t / 900 + p.phase)
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (p.alpha * shimmer).toFixed(3) + ')'
}

let last = 0
function frame(now) {
  if (!running) return
  const t = now
  // 半透明拖尾清屏
  ctx.fillStyle = 'rgba(14,17,22,0.30)'
  ctx.fillRect(0, 0, W, H)
  for (const p of particles) {
    const g = targetFor(p, t)
    const k = 0.014
    p.vx += (g.x - p.x) * k
    p.vy += (g.y - p.y) * k
    p.vx *= 0.90
    p.vy *= 0.90
    p.x += p.vx
    p.y += p.vy
    ctx.beginPath()
    ctx.fillStyle = colorOf(p, t)
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2)
    ctx.fill()
  }
  // 光晕层：复制主画面 + CSS blur
  gctx.clearRect(0, 0, W, H)
  gctx.drawImage(main, 0, 0, W, H)
  requestAnimationFrame(frame)
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) running = false
  else if (!running) { running = true; requestAnimationFrame(frame) }
})

/* ── 启动 ── */
window.__errs = []
window.addEventListener('error', (e) => window.__errs.push(String(e.message)))
window.addEventListener('unhandledrejection', (e) => window.__errs.push('rejection: ' + String(e.reason)))

resize()
sampleTargets().then((pts) => {
  targets = pts
  makeParticles()
  running = true
  // 调试钩子（加载页验证用）
  window.__targets = targets
  window.__particles = particles
  window.__running = () => running
  requestAnimationFrame(frame)
}).catch(() => {
  // 采样失败（极端环境）：退化为纯文字
  document.querySelector('.whale-wrap').style.display = 'none'
})

if (location.search) {
  const q = new URLSearchParams(location.search)
  const state = q.get('state')
  if (state) document.getElementById('sub').textContent = decodeURIComponent(state)
}
</script>
</body>
</html>
